<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A5FA8"/>
      <stop offset="0.55" stop-color="#0B84A5"/>
      <stop offset="1" stop-color="#14B8C4"/>
    </linearGradient>
    <clipPath id="globeClip"><circle cx="512" cy="512" r="252"/></clipPath>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- 地球（浏览器） -->
  <g stroke="#FFFFFF" fill="none">
    <circle cx="512" cy="512" r="252" stroke-width="26"/>
    <ellipse cx="512" cy="512" rx="118" ry="252" stroke-width="18" opacity="0.9"/>
    <ellipse cx="512" cy="512" rx="206" ry="252" stroke-width="12" opacity="0.45"/>
    <g clip-path="url(#globeClip)" stroke-width="16" opacity="0.8">
      <line x1="180" y1="398" x2="844" y2="398"/>
      <line x1="180" y1="626" x2="844" y2="626"/>
    </g>
  </g>

  <!-- 拉链（zip），裁剪在地球内 -->
  <g clip-path="url(#globeClip)">
    <!-- 布带 -->
    <line x1="486" y1="264" x2="486" y2="760" stroke="#07304A" stroke-width="12"/>
    <line x1="538" y1="264" x2="538" y2="760" stroke="#07304A" stroke-width="12"/>
    <!-- 齿 -->
    <rect x="492" y="296" width="40" height="18" rx="4" fill="#FFFFFF"/>
  <rect x="492" y="330" width="40" height="18" rx="4" fill="#FFFFFF"/>
  <rect x="492" y="364" width="40" height="18" rx="4" fill="#FFFFFF"/>
  <rect x="492" y="398" width="40" height="18" rx="4" fill="#FFFFFF"/>
  <rect x="492" y="432" width="40" height="18" rx="4" fill="#FFFFFF"/>
  <rect x="492" y="466" width="40" height="18" rx="4" fill="#FFFFFF"/>
  <rect x="492" y="500" width="40" height="18" rx="4" fill="#FFFFFF"/>
  <rect x="492" y="534" width="40" height="18" rx="4" fill="#FFFFFF"/>
  <rect x="492" y="568" width="40" height="18" rx="4" fill="#FFFFFF"/>
  <rect x="492" y="602" width="40" height="18" rx="4" fill="#FFFFFF"/>
  <rect x="492" y="636" width="40" height="18" rx="4" fill="#FFFFFF"/>
  <rect x="492" y="670" width="40" height="18" rx="4" fill="#FFFFFF"/>
  <rect x="492" y="704" width="40" height="18" rx="4" fill="#FFFFFF"/>
    <!-- 中缝 -->
    <line x1="512" y1="264" x2="512" y2="760" stroke="#07304A" stroke-width="7"/>
    <!-- 拉链头滑块 -->
    <rect x="468" y="540" width="88" height="58" rx="16" fill="#07304A"/>
    <rect x="498" y="552" width="28" height="34" rx="6" fill="#0B84A5"/>
    <!-- 拉片 -->
    <line x1="512" y1="598" x2="512" y2="628" stroke="#07304A" stroke-width="14"/>
    <circle cx="512" cy="652" r="26" fill="none" stroke="#07304A" stroke-width="14"/>
  </g>
</svg>
