name: build-windows

# Windows 桌面版必须在 Windows 主机上构建（Flutter 不支持在 Linux 交叉编译），
# 因此通过 GitHub Actions 的 Windows 运行器产出可直接分发的 zip 包。
#
# 构建矩阵：三种风味 × 两个架构
#   none     无内核版：不加载网页
#   chromium Chromium 内核版：系统 WebView2（Edge Chromium）
#   gecko    Gecko 内核版：构建时编译内核 DLL，随包内置
# 架构：x64 与 arm64，均在 windows-latest 上交叉构建
# （Flutter 通过 --target-platform 选择目标架构，MSVC 提供 ARM64 交叉工具链）。
#
# 本工作流做四件事：
#   1. 静态检查与单元测试（analyze 必须 0 error / 0 warning，test 必须全绿）
#   2. 生成被 .gitignore 忽略的 windows/ 工程骨架并集成 native surface 插件
#   3. Gecko 风味编译内核 DLL 并装配进内核包
#   4. 打包成 zip / 安装器并（打 tag 时）挂到 GitHub Release
on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter SDK 版本'
        required: false
        default: '3.47.6'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'lib/**'
      - 'native_plugins/**'
      - 'native_kernels/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'native_plugins/**'
      - 'native_kernels/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: ${{ github.event.inputs.flutter_version || '3.47.6' }}
  # webview_windows 仍在用 /await 时代的实验性协程头，最新 MSVC（VS 18）已把
  # STL1011 升级为硬错误。cl.exe 会把 CL 环境变量的内容前置到命令行，
  # 借此给所有编译单元注入官方静默宏以恢复可编译。
  CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

jobs:
  # ---------------------------------------------------------------
  # 1) 静态检查 + 单元测试（唯一的质量闸门，后续 job 依赖它）
  # ---------------------------------------------------------------
  analyze:
    name: Analyze & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate Windows platform files
        run: flutter create --platforms=windows --org com.zipbrowser --project-name zip_browser .

      # flutter create 会补齐模板自带的 test/widget_test.dart（其中引用模板类
      # MyApp，本项目并不存在），若不删除，随后的 analyze / test 都会因编译错误
      # 直接失败。该文件由工具生成、不入库，这里显式移除。
      - name: Remove template widget test
        shell: pwsh
        run: |
          if (Test-Path test/widget_test.dart) {
            Remove-Item -Force test/widget_test.dart
            Write-Host "已移除模板测试 test/widget_test.dart"
          }

      - name: Resolve dependencies
        run: flutter pub get

      # flutter analyze 只要发现任何 issue（含 info）就会返回非 0，
      # 而仓库里第三方包的 deprecation 提示不受我们控制，因此这里显式
      # 区分 severity：error / warning 必须为 0，info 允许存在。
      - name: Static analysis
        shell: pwsh
        run: |
          $out = & flutter analyze 2>&1 | Out-String
          Write-Host $out
          $bad = ($out -split "`n") | Where-Object { $_ -match '^\s*(error|warning)\s+-' }
          if ($bad) {
            Write-Host "::error::静态检查存在 error / warning 级问题"
            $bad | ForEach-Object { Write-Host $_ }
            exit 1
          }
          Write-Host "静态检查通过：0 error / 0 warning"

      - name: Unit tests
        run: flutter test --reporter expanded

  # ---------------------------------------------------------------
  # 2) 构建 Windows 桌面版并打包（风味 × 架构矩阵）
  # ---------------------------------------------------------------
  windows:
    name: Build Windows ${{ matrix.arch }}-${{ matrix.flavor }}
    runs-on: ${{ matrix.runner }}
    needs: [analyze]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            cmake_arch: x64
            redist_dir: x64
            flavor: chromium
            suffix: '-chromium'
          - arch: x64
            runner: windows-latest
            cmake_arch: x64
            redist_dir: x64
            flavor: gecko
            suffix: '-gecko'
          - arch: x64
            runner: windows-latest
            cmake_arch: x64
            redist_dir: x64
            flavor: none
            suffix: '-no-kernel'
          - arch: arm64
            runner: windows-latest
            cmake_arch: ARM64
            redist_dir: arm64
            flavor: chromium
            suffix: '-chromium'
          - arch: arm64
            runner: windows-latest
            cmake_arch: ARM64
            redist_dir: arm64
            flavor: gecko
            suffix: '-gecko'
          - arch: arm64
            runner: windows-latest
            cmake_arch: ARM64
            redist_dir: arm64
            flavor: none
            suffix: '-no-kernel'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows platform files
        run: flutter create --platforms=windows --org com.zipbrowser --project-name zip_browser .

      - name: Integrate native surface plugin
        run: python tool/enable_native_surface.py

      - name: Set up MSVC (${{ matrix.cmake_arch }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      # Gecko 风味：用 CMake + MSVC 编译内核 DLL，装配进内核包并放入资产目录。
      - name: Build bundled Gecko kernel DLL
        if: matrix.flavor == 'gecko'
        shell: pwsh
        run: |
          cmake -S native_kernels/zb_lite_kernel -B build/gecko-kernel -A ${{ matrix.cmake_arch }} `
                -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake 配置失败：$LASTEXITCODE" }
          cmake --build build/gecko-kernel --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "内核编译失败：$LASTEXITCODE" }

          $dll = Get-ChildItem -Recurse -Path build/gecko-kernel -Filter 'zb_lite_kernel.dll' |
                 Select-Object -First 1
          if (-not $dll) { throw '未找到编译产物 zb_lite_kernel.dll' }

          # ABI 符号自检：与宿主约定的 16 个导出必须齐全
          $required = @(
            'zb_abi_version','zb_kernel_create','zb_kernel_destroy',
            'zb_kernel_name','zb_kernel_version',
            'zb_kernel_load_url','zb_kernel_go_back','zb_kernel_go_forward',
            'zb_kernel_reload','zb_kernel_eval_js',
            'zb_kernel_current_url','zb_kernel_title',
            'zb_kernel_attach_surface','zb_kernel_tick',
            'zb_kernel_dispatch_from_host','zb_free_ptr'
          )
          $text = (& dumpbin /nologo /exports $dll.FullName) -join "`n"
          $missing = $required | Where-Object { $text -notmatch [regex]::Escape($_) }
          if ($missing) { throw "内核缺少导出符号：$($missing -join ', ')" }

          $out = 'build_kernel_pkg/zb_gecko_kernel/bin/windows'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $dll.FullName "$out/zb_gecko_kernel.dll" -Force
          New-Item -ItemType Directory -Force -Path assets/bundled | Out-Null
          python tool/pack_kernel.py build_kernel_pkg/zb_gecko_kernel assets/bundled/kernel.zbk --platforms windows
          if ($LASTEXITCODE -ne 0) { throw "内核打包失败：$LASTEXITCODE" }
          Get-Item assets/bundled/kernel.zbk | ForEach-Object {
            Write-Host ("内置内核包：{0:N0} 字节" -f $_.Length)
          }

      - name: Resolve dependencies
        run: flutter pub get

      # —— App 本体 ——
      - name: Build Windows release
        run: >-
          flutter build windows --release
          --target-platform windows-${{ matrix.arch }}
          --dart-define=ZIP_FLAVOR=${{ matrix.flavor }}

      # 兜底：把 VC++ 运行库 DLL 直接放进应用目录（app-local deployment）。
      # 即使目标机没装 VC++ Redistributable、且安装器静默安装失败，
      # exe 也能正常加载 —— 双保险修复「安装后无法运行」。
      - name: Bundle VC++ runtime DLLs (app-local)
        shell: pwsh
        run: |
          $out = 'build/windows/${{ matrix.arch }}/runner/Release'
          $redistRoot = $env:VCToolsRedistDir
          if (-not $redistRoot) { throw '未找到 VCToolsRedistDir（需先运行 Set up MSVC）' }
          $crt = Get-ChildItem -Path $redistRoot -Recurse -Filter 'vcruntime140.dll' |
                 Where-Object { $_.Directory.FullName -match "\\${{ matrix.redist_dir }}\\" } |
                 Select-Object -First 1
          if (-not $crt) { throw '未找到 VC++ 运行库 DLL' }
          $dir = $crt.Directory.FullName
          foreach ($dll in @('msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll','concrt140.dll')) {
            $src = Join-Path $dir $dll
            if (Test-Path $src) {
              Copy-Item $src $out -Force
              Write-Host "已捆绑 $dll"
            } else {
              Write-Host "跳过 $dll（不存在）"
            }
          }

      # 防呆：webview_windows 通过 NuGet 的 WebView2 targets 拷贝
      # WebView2Loader.dll，若因构建环境变动缺失，安装后双击 exe 会报
      # 「丢失 WebView2Loader.dll」直接无法启动。这里兜底从插件 NuGet
      # 缓存里找一份补进 Release 目录。
      - name: Ensure WebView2Loader.dll ships in Release
        shell: pwsh
        run: |
          $out = 'build/windows/${{ matrix.arch }}/runner/Release'
          if (Test-Path "$out/WebView2Loader.dll") {
            Write-Host 'WebView2Loader.dll 已在 Release 输出中'
          } else {
            Write-Host 'WebView2Loader.dll 缺失，尝试从 NuGet 缓存兜底拷贝...'
            $src = Get-ChildItem -Recurse -Path build -Filter 'WebView2Loader.dll' |
                   Where-Object { $_.FullName -match '${{ matrix.arch }}' } | Select-Object -First 1
            if (-not $src) { throw 'Release 缺少 WebView2Loader.dll 且 NuGet 缓存中未找到' }
            Copy-Item $src.FullName "$out/WebView2Loader.dll"
            Write-Host ("已拷贝：{0}" -f $src.FullName)
          }

      # —— 安装器运行时依赖（VC++ 运行库 + WebView2 常青版引导器）——
      - name: Fetch installer prerequisites
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: python tool/fetch_installer_prereqs.py build/installer-prereqs

      - name: Locate build output
        id: out
        shell: pwsh
        run: |
          $dir = 'build/windows/${{ matrix.arch }}/runner/Release'
          if (-not (Test-Path $dir)) { throw "未找到构建输出目录：$dir" }
          $exe = Join-Path $dir 'zip_browser.exe'
          if (-not (Test-Path $exe)) { throw "未找到可执行文件：$exe" }
          Get-ChildItem $dir -Recurse -File |
            Measure-Object -Property Length -Sum |
            ForEach-Object { Write-Host ("Release：{0:N1} MB / {1} 个文件" -f ($_.Sum/1MB), $_.Count) }
          "dir=$dir" >> $env:GITHUB_OUTPUT

      - name: Package release archive
        shell: pwsh
        run: |
          $out = '${{ steps.out.outputs.dir }}'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $suffix = '${{ matrix.suffix }}'
          Compress-Archive -Path "$out/*" `
            -DestinationPath "dist/zip-browser-windows-${{ matrix.arch }}$suffix.zip" -Force

          Get-ChildItem dist | ForEach-Object {
            Write-Host ("  {0}  {1:N2} MB" -f $_.Name, ($_.Length/1MB))
          }

      # —— 安装版（Inno Setup）——
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:').Line `
              -replace '^version:\s*','' -replace '\+\d+$',''
          Write-Host "打包版本：$ver"
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*' -Recurse -Filter ISCC.exe |
                  Select-Object -First 1
          if (-not $iscc) { throw '未找到 ISCC.exe' }
          & $iscc.FullName ".tooling\installer.iss" `
              "/DAppVersion=$ver" "/DFlavor=${{ matrix.flavor }}" `
              "/DTargetArch=${{ matrix.arch }}"
          if ($LASTEXITCODE -ne 0) { throw "ISCC 失败：$LASTEXITCODE" }
          Get-ChildItem dist | ForEach-Object {
            Write-Host ("  {0}  {1:N2} MB" -f $_.Name, ($_.Length/1MB))
          }

      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: zip-browser-windows-${{ matrix.arch }}-${{ matrix.flavor }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: zip-browser-windows-${{ matrix.arch }}-setup-${{ matrix.flavor }}
          path: dist/*.exe
          if-no-files-found: error

      # 打 v* tag 时把 Windows 包挂到 Release。
      # 刻意不开 generate_release_notes：Release 的说明是人工撰写的
      # （见 .tooling/release_notes_v*.md），自动生成的说明会把它覆盖掉。
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
          fail_on_unmatched_files: false
