name: build-android-apk

# 构建 Android 安装包（release APK，universal 单包 + 按 ABI 拆分包），
# 覆盖三种构建风味：none=无内核版 / chromium=Chromium 内核版 / gecko=Gecko 内核版
# （--dart-define=ZIP_FLAVOR=...，见 lib/core/build_flavor.dart）。
# Chromium 风味使用系统 WebView，无需编译内核；Gecko 风味在构建时交叉编译
# 四个 ABI 的内核并作为资产随 APK 打包。
# 注意：android/ 工程（含相机 FileProvider 等原生定制）随仓库提交，
#       CI 直接构建，不再 flutter create。
#
# 触发条件：
#   * main 分支推送 —— 让 APK 路径在合入时就得到验证，而不是等到发版才发现坏了；
#   * v* tag       —— 打包并挂到对应的 GitHub Release；
#   * 手动 dispatch。
# 刻意不加 paths 过滤：GitHub Actions 里 paths 与 branches/tags 是「与」关系，
# 同时写上会让 main 推送永远匹配不上（build-kernel 曾因此漏跑）。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 静态检查只跑一次（x64 风味的产物与风味无关）。
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      # android/build.gradle.kts 已随仓库提交（compileSdk 36 + 子模块补丁，
      # 见 tool/patch_android_gradle.py 幂等生成）；以下步骤仅在骨架漂移时兜底。
      - name: Patch Android Gradle (compileSdk / minSdk / ML Kit, idempotent)
        run: python3 tool/patch_android_gradle.py

      # flutter create 会补齐模板自带的 test/widget_test.dart（其中引用模板类 MyApp，
      # 与本项目的 ZipBrowserApp 不符），会让 flutter analyze 直接报错，这里移除它。
      - name: Remove template widget test
        run: rm -f test/widget_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

  apk:
    name: Build Android APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    needs: [analyze]
    strategy:
      fail-fast: false
      matrix:
        flavor: [none, chromium, gecko]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      # 把 Maven Central 换成镜像：GitHub 运行器访问 Central 会被重定向到
      # GitHub Release 资源，高峰期 504（Kotlin 编译器下载失败）。
      - name: Configure Gradle mirror (CI)
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cp tool/ci_gradle_mirror.gradle "$HOME/.gradle/init.d/ci-mirror.gradle"

      - name: Patch Android Gradle (compileSdk / minSdk / ML Kit, idempotent)
        run: python3 tool/patch_android_gradle.py

      # Gecko 风味：NDK 交叉编译 arm64-v8a / armeabi-v7a / x86 / x86_64
      # 四个 ABI 的内核，装配成 .zbk 放进资产目录，首次启动自动安装。
      - name: Build bundled Gecko kernel (NDK)
        if: matrix.flavor == 'gecko'
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          "$SDKMANAGER" --install "ndk;28.2.13676358" > /dev/null
          export ANDROID_NDK="$SDK/ndk/28.2.13676358"
          python3 tool/build_engine_kernels.py --platform android
          mkdir -p assets/bundled
          python3 tool/pack_kernel.py build_kernel_pkg/zb_gecko_kernel assets/bundled/kernel.zbk --platforms android
          unzip -l assets/bundled/kernel.zbk

      - name: Resolve dependencies
        run: flutter pub get

      # 按 CPU 架构拆分成 4 个安装包（arm64-v8a / armeabi-v7a / x86 / x86_64），
      # 体积更小；另产一个 universal 全架构包（单包兼容所有设备）。
      # Gradle 首次构建要从 GitHub Releases 下载 Kotlin 编译器，偶发 504，
      # 因此两处构建都做有限重试。
      - name: Build split-per-abi APKs
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if flutter build apk --release --split-per-abi \
                --dart-define=ZIP_FLAVOR=${{ matrix.flavor }}; then
              exit 0
            fi
            echo "第 $attempt 次构建失败，30 秒后重试" >&2
            sleep 30
          done
          exit 1

      - name: Build universal APK
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if flutter build apk --release \
                --dart-define=ZIP_FLAVOR=${{ matrix.flavor }}; then
              exit 0
            fi
            echo "第 $attempt 次构建失败，30 秒后重试" >&2
            sleep 30
          done
          exit 1

      - name: Collect APKs
        run: |
          set -euo pipefail
          case "${{ matrix.flavor }}" in
            none)     SUFFIX="-no-kernel" ;;
            chromium) SUFFIX="-chromium" ;;
            gecko)    SUFFIX="-gecko" ;;
            *)        SUFFIX="" ;;
          esac
          echo "SUFFIX=$SUFFIX" >> "$GITHUB_ENV"
          mkdir -p dist
          src=build/app/outputs/flutter-apk
          cp "$src/app-arm64-v8a-release.apk" "dist/zip-browser-android-arm64-v8a$SUFFIX.apk"
          cp "$src/app-armeabi-v7a-release.apk" "dist/zip-browser-android-armeabi-v7a$SUFFIX.apk"
          cp "$src/app-x86-release.apk" "dist/zip-browser-android-x86$SUFFIX.apk"
          cp "$src/app-x86_64-release.apk" "dist/zip-browser-android-x86_64$SUFFIX.apk"
          cp "$src/app-release.apk" "dist/zip-browser-android-universal$SUFFIX.apk"
          ls -lh dist

      # 校验每个 APK 的 ABI 库与清单都在（而不是只检查"文件存在"）。
      - name: Verify APK contents
        run: |
          set -euo pipefail
          export SUFFIX="$SUFFIX"
          python3 - <<'PY'
          import os, zipfile
          suffix = os.environ['SUFFIX']
          base = f'dist/zip-browser-android-'
          checks = {
            f'{base}arm64-v8a{suffix}.apk': 'lib/arm64-v8a/libapp.so',
            f'{base}armeabi-v7a{suffix}.apk': 'lib/armeabi-v7a/libapp.so',
            f'{base}x86{suffix}.apk': 'lib/x86/libapp.so',
            f'{base}x86_64{suffix}.apk': 'lib/x86_64/libapp.so',
            f'{base}universal{suffix}.apk': 'lib/arm64-v8a/libapp.so',
          }
          for path, need_lib in checks.items():
              with zipfile.ZipFile(path) as z:
                  names = z.namelist()
                  print(path, '条目数：', len(names))
                  libs = sorted(n for n in names if n.startswith('lib/'))
                  print('  引擎库：', ' '.join(n.split('/')[1] for n in libs))
                  for need in ['AndroidManifest.xml', 'classes.dex', need_lib]:
                      ok = need in names
                      print(('[OK]   ' if ok else '[FAIL] '), need)
                      assert ok, f'{path}: 缺少 {need}'
          # universal 应包含全部四个 ABI
          with zipfile.ZipFile(f'{base}universal{suffix}.apk') as z:
              names = set(n for n in z.namelist() if n.startswith('lib/'))
              for abi in ('arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'):
                  assert any(n.startswith(f'lib/{abi}/') for n in names), f'universal 缺 {abi}'
          print('APK 内容校验通过')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zip-browser-android-apk-${{ matrix.flavor }}
          path: dist/*.apk
          if-no-files-found: error

      # 打 v* tag 时把 APK 挂到 Release。
      # 刻意不开 generate_release_notes：Release 说明为人工撰写
      # （见 .tooling/release_notes_v*.md），自动生成会覆盖它。
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          fail_on_unmatched_files: false
