name: build-android-apk

# 构建 Android 安装包（release APK）。
# 注意：仓库 .gitignore 忽略了根目录下的 android/（由 flutter create 生成），
#       因此 CI 必须先执行 flutter create 生成 android 工程骨架。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.zipbrowser --project-name zip_browser .

      # flutter create 会补齐模板自带的 test/widget_test.dart（其中引用模板类 MyApp，
      # 与本项目的 ZipBrowserApp 不符），会让 flutter analyze 直接报错，这里移除它。
      - name: Remove template widget test
        run: rm -f test/widget_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zip-browser-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
