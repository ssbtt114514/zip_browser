name: build-android-apk

# 构建 Android 安装包（release APK，universal 单包，内含 arm64-v8a / armeabi-v7a / x86_64）。
# 注意：仓库 .gitignore 忽略了根目录下的 android/（由 flutter create 生成），
#       因此 CI 必须先执行 flutter create 生成 android 工程骨架。
#
# 触发条件：
#   * main 分支推送 —— 让 APK 路径在合入时就得到验证，而不是等到发版才发现坏了；
#   * v* tag       —— 打包并挂到对应的 GitHub Release；
#   * 手动 dispatch。
# 刻意不加 paths 过滤：GitHub Actions 里 paths 与 branches/tags 是「与」关系，
# 同时写上会让 main 推送永远匹配不上（build-kernel 曾因此漏跑）。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.zipbrowser --project-name zip_browser .

      # flutter create 生成的骨架不含本地手工补丁：部分插件（如 file_picker）子模块
      # 硬编码了较低 compileSdk，会导致 :file_picker:checkReleaseAarMetadata 失败。
      # 该脚本把各插件子模块的 compileSdk 统一提升到 36（幂等）。
      - name: Patch Android Gradle (pin plugin compileSdk)
        run: python3 tool/patch_android_gradle.py

      # flutter create 会补齐模板自带的 test/widget_test.dart（其中引用模板类 MyApp，
      # 与本项目的 ZipBrowserApp 不符），会让 flutter analyze 直接报错，这里移除它。
      - name: Remove template widget test
        run: rm -f test/widget_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # 按 CPU 架构拆分成 3 个安装包（arm64-v8a / armeabi-v7a / x86_64），
      # 体积更小；另产一个 universal 全架构包（单包兼容所有设备）。
      - name: Build split-per-abi APKs
        run: flutter build apk --release --split-per-abi

      - name: Build universal APK
        run: flutter build apk --release

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          src=build/app/outputs/flutter-apk
          cp "$src/app-arm64-v8a-release.apk" dist/zip-browser-android-arm64-v8a.apk
          cp "$src/app-armeabi-v7a-release.apk" dist/zip-browser-android-armeabi-v7a.apk
          cp "$src/app-x86_64-release.apk" dist/zip-browser-android-x86_64.apk
          cp "$src/app-release.apk" dist/zip-browser-android-universal.apk
          ls -lh dist

      # 校验每个 APK 的 ABI 库与清单都在（而不是只检查"文件存在"）。
      - name: Verify APK contents
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          checks = {
            'dist/zip-browser-android-arm64-v8a.apk': 'lib/arm64-v8a/libapp.so',
            'dist/zip-browser-android-armeabi-v7a.apk': 'lib/armeabi-v7a/libapp.so',
            'dist/zip-browser-android-x86_64.apk': 'lib/x86_64/libapp.so',
            'dist/zip-browser-android-universal.apk': 'lib/arm64-v8a/libapp.so',
          }
          for path, need_lib in checks.items():
              with zipfile.ZipFile(path) as z:
                  names = z.namelist()
                  print(path, '条目数：', len(names))
                  libs = sorted(n for n in names if n.startswith('lib/'))
                  print('  引擎库：', ' '.join(n.split('/')[1] for n in libs))
                  for need in ['AndroidManifest.xml', 'classes.dex', need_lib]:
                      ok = need in names
                      print(('[OK]   ' if ok else '[FAIL] '), need)
                      assert ok, f'{path}: 缺少 {need}'
          # universal 应包含全部三个 ABI
          with zipfile.ZipFile('dist/zip-browser-android-universal.apk') as z:
              names = set(n for n in z.namelist() if n.startswith('lib/'))
              for abi in ('arm64-v8a', 'armeabi-v7a', 'x86_64'):
                  assert any(n.startswith(f'lib/{abi}/') for n in names), f'universal 缺 {abi}'
          print('APK 内容校验通过')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zip-browser-android-apk
          path: dist/*.apk
          if-no-files-found: error

      # 打 v* tag 时把 APK 挂到 Release。
      # 刻意不开 generate_release_notes：Release 说明为人工撰写
      # （见 .tooling/release_notes_v*.md），自动生成会覆盖它。
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          fail_on_unmatched_files: false
