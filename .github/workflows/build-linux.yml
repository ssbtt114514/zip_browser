name: build-linux

# 构建 Linux 桌面版并打包：x64（ubuntu-latest）与 arm64/aarch64（ubuntu-24.04-arm
# 原生 ARM 运行器）两个架构，每个架构各产出三种构建风味
# （none=无内核版 / chromium=Chromium 内核版 / gecko=Gecko 内核版，
# --dart-define=ZIP_FLAVOR=...），每份产物包含 tar.gz 与 .deb 安装包。
# Gecko 风味在构建机上用 gcc 编译本架构内核并随包内置；Chromium 风味
# 使用系统 WebKitGTK。
# Flutter 不支持交叉编译桌面版：Linux 产物只能在同架构 Linux 主机上构建，
# 因此用 GitHub 的 amd64 / arm64 原生运行器分别构建。
#
# 依赖说明：Linux 桌面版需要 GTK3 开发库与 clang/cmake/ninja；
# libstdc++-12-dev 在 ubuntu-24.04 上是 Flutter 官方文档要求的包，
# 在更老的镜像里可能不存在，故用 `|| true` 容忍（缺失时不影响编译）。
#
# 触发条件与 build-android-apk 一致：main 推送（尽早暴露问题）、v* tag（挂 Release）、手动。
# 刻意不加 paths 过滤：paths 与 branches/tags 在 Actions 里是「与」关系，
# 同时写上会让 main 推送永远匹配不上。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 静态检查与单元测试只在 x64 上跑一次：风味不影响分析结果，
  # arm64 运行器拉起成本高，不再重复跑。
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev
          sudo apt-get install -y libstdc++-12-dev || true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Generate Linux platform files
        run: flutter create --platforms=linux --org com.zipbrowser --project-name zip_browser .

      # flutter create 会补齐模板自带的 test/widget_test.dart（引用模板类 MyApp，
      # 本项目并不存在），不删掉会让 analyze / test 直接编译失败。
      - name: Remove template widget test
        run: rm -f test/widget_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test --reporter expanded

  linux:
    name: Build Linux ${{ matrix.label }}-${{ matrix.flavor }}
    runs-on: ${{ matrix.runner }}
    needs: [analyze]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            arch: amd64
            runner: ubuntu-latest
            flutter_version: 3.47.6
            flavor: chromium
            suffix: '-chromium'
          - label: x64
            arch: amd64
            runner: ubuntu-latest
            flutter_version: 3.47.6
            flavor: gecko
            suffix: '-gecko'
          - label: x64
            arch: amd64
            runner: ubuntu-latest
            flutter_version: 3.47.6
            flavor: none
            suffix: '-no-kernel'
          # GitHub 原生 ARM 运行器：subosito/flutter-action 在 arm64 上无法解析
          # 固定版本号（如 3.47.6），这里改用最新 stable。
          - label: aarch64
            arch: arm64
            runner: ubuntu-24.04-arm
            flutter_version: ''
            flavor: chromium
            suffix: '-chromium'
          - label: aarch64
            arch: arm64
            runner: ubuntu-24.04-arm
            flutter_version: ''
            flavor: gecko
            suffix: '-gecko'
          - label: aarch64
            arch: arm64
            runner: ubuntu-24.04-arm
            flutter_version: ''
            flavor: none
            suffix: '-no-kernel'
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev
          sudo apt-get install -y libstdc++-12-dev || true

      - name: Setup Flutter (pinned)
        if: matrix.flutter_version != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter_version }}
          channel: stable
          cache: true

      # aarch64：subosito/flutter-action 无法在 arm64 解析任何版本，官方
      # releases_linux.json 也只发布 x64 SDK；arm64 Linux 上官方推荐用 snap 安装。
      - name: Setup Flutter via snap (aarch64)
        if: matrix.flutter_version == ''
        run: |
          sudo snap install flutter --classic
          echo "/snap/bin" >> "$GITHUB_PATH"
          flutter --version

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Generate Linux platform files
        run: flutter create --platforms=linux --org com.zipbrowser --project-name zip_browser .

      - name: Remove template widget test
        run: rm -f test/widget_test.dart

      # Gecko 风味：用本机 gcc 编译本架构内核，装配成 .zbk 后作为资产内置
      - name: Build bundled Gecko kernel
        if: matrix.flavor == 'gecko'
        run: |
          set -euo pipefail
          python3 tool/build_engine_kernels.py --platform linux
          mkdir -p assets/bundled
          python3 tool/pack_kernel.py build_kernel_pkg/zb_gecko_kernel assets/bundled/kernel.zbk --platforms linux
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('assets/bundled/kernel.zbk') as z:
              names = z.namelist()
              assert any(n.endswith('kernel.json') for n in names), '缺少 kernel.json'
              assert any(n.startswith('bin/linux/') for n in names), '缺少 linux 内核库'
              print('内置内核包条目：', len(names))
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Linux release (${{ matrix.flavor }})
        run: flutter build linux --release --dart-define=ZIP_FLAVOR=${{ matrix.flavor }}

      - name: Package tar.gz
        run: |
          set -euo pipefail
          MACHINE=$(uname -m)
          case "$MACHINE" in
            x86_64) FLUTTER_ARCH=x64 ;;
            aarch64) FLUTTER_ARCH=arm64 ;;
            *) echo "::error::不支持的架构：$MACHINE"; exit 1 ;;
          esac
          echo "Flutter 架构目录：$FLUTTER_ARCH"
          bundle=build/linux/$FLUTTER_ARCH/release/bundle
          test -d "$bundle" || { echo "::error::未找到 $bundle"; exit 1; }
          test -x "$bundle/zip_browser" || { echo "::error::未找到可执行文件 $bundle/zip_browser"; exit 1; }
          mkdir -p dist
          # 顶层放一个 bundle/ 目录，解包后不会把文件撒在当前目录里
          tar -czf "dist/zip-browser-linux-${{ matrix.arch }}${{ matrix.suffix }}.tar.gz" \
              -C "$(dirname "$bundle")" "$(basename "$bundle")"
          ls -lh dist

      # 确认 tar 包里有可执行文件、Flutter 引擎库与 data 目录，
      # 而不只是"文件存在"。
      - name: Verify tar contents
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tarfile
          path = 'dist/zip-browser-linux-${{ matrix.arch }}${{ matrix.suffix }}.tar.gz'
          with tarfile.open(path) as t:
              names = t.getnames()
              print('tar 条目数：', len(names))
              for need in ['bundle/zip_browser', 'bundle/lib/libflutter_linux_gtk.so']:
                  ok = need in names
                  print(('[OK]   ' if ok else '[FAIL] '), need)
                  assert ok, need
              assert any(n.startswith('bundle/data/') for n in names), 'bundle/data/ 缺失'
              print('tar 内容校验通过')
          PY

      # —— .deb 安装包 ——
      - name: Pack .deb
        run: |
          set -euo pipefail
          MACHINE=$(uname -m)
          case "$MACHINE" in
            x86_64) FLUTTER_ARCH=x64 ;;
            aarch64) FLUTTER_ARCH=arm64 ;;
          esac
          bundle=build/linux/$FLUTTER_ARCH/release/bundle
          VERSION=$(python3 -c "from pathlib import Path; l=[x for x in Path('pubspec.yaml').read_text().splitlines() if x.startswith('version:')][0]; print(l.split(':')[1].strip().split('+')[0])")
          echo "打包版本：$VERSION · 架构：${{ matrix.arch }} · 风味：${{ matrix.flavor }}"
          python3 tool/pack_deb.py "$bundle" \
            "dist/zip-browser-linux-${{ matrix.arch }}${{ matrix.suffix }}.deb" \
            --version "$VERSION" --arch ${{ matrix.arch }}

      - name: Verify .deb
        run: |
          set -euo pipefail
          dpkg-deb --info dist/zip-browser-linux-${{ matrix.arch }}${{ matrix.suffix }}.deb | head -20
          echo "--- 关键文件 ---"
          dpkg-deb --contents dist/zip-browser-linux-${{ matrix.arch }}${{ matrix.suffix }}.deb | \
            grep -E "usr/bin/zip-browser|libflutter|data/" | head -6

      - name: Upload Linux archives
        uses: actions/upload-artifact@v4
        with:
          name: zip-browser-linux-${{ matrix.arch }}-${{ matrix.flavor }}
          path: dist/*
          if-no-files-found: error

      # 打 v* tag 时挂到 Release；不开 generate_release_notes 以免覆盖人工说明。
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: false
