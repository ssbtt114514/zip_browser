name: build-kernel

# 构建 FFI 内核插件的多平台产物：
#   - Windows：zb_lite_kernel.dll / zb_example_kernel.dll
#   - Linux：libzb_lite_kernel.so（附带 gcc 端到端自检）
#   - Android：arm64-v8a / armeabi-v7a / x86_64 三个 ABI 的 .so
# 最后统一打包为可安装的插件 zip（lite_kernel.zip / hello_ffi_kernel.zip）
# 与独立内核包（.zbk）。
#
# 产物目录严格对应 example_plugins/*/manifest.json 中 kernel.libraries 的声明，
# 打包脚本 tool/pack_plugin.py 会以插件目录为 zip 根，得到可直接安装的插件包。
# 触发说明（这里有个容易踩的坑）：
#   GitHub 在 `push` 下**同时**指定 `tags` 与 `paths` 时，两个过滤器是"与"关系 ——
#   于是只写 `tags: ['v*']` + `paths` 会导致主干推送完全不触发（实测：推送
#   `.github/workflows/build-kernel.yml` 到 main 后没有任何 run）。
#   因此这里显式声明 `branches: [main]`：分支与标签之间是"或"，两者都要过 paths。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'native_kernels/**'
      - 'example_plugins/lite_kernel/**'
      - 'example_plugins/hello_ffi_kernel/**'
      - 'native_plugins/zb_native_surface/include/**'
      - 'build_kernel_pkg/**'
      - 'tool/build_lite_kernel.sh'
      - 'tool/build_lite_kernel.bat'
      - 'tool/pack_plugin.py'
      - 'tool/pack_kernel.py'
      - '.github/workflows/build-kernel.yml'
  pull_request:
    paths:
      - 'native_kernels/**'
      - 'example_plugins/lite_kernel/**'
      - 'tool/build_lite_kernel.sh'
      - 'tool/build_lite_kernel.bat'
      - '.github/workflows/build-kernel.yml'

env:
  INCLUDE_DIR: native_plugins/zb_native_surface/include
  LITE_DIR: native_kernels/zb_lite_kernel
  LITE_PLUGIN: example_plugins/lite_kernel
  EXAMPLE_DIR: example_plugins/hello_ffi_kernel
  EXAMPLE_SRC: example_plugins/hello_ffi_kernel/kernels/windows/zb_example_kernel.c

jobs:
  # ---------------------------------------------------------------
  # 0) 端到端自检：用 gcc 编译内核 + 自检程序并运行
  #    这是唯一能证明内核"真的能解析、排版、渲染"的验证手段。
  # ---------------------------------------------------------------
  selftest:
    name: Self-test (linux/gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile kernel + selftest
        run: |
          mkdir -p build
          # 不加 -Werror：本地验证用的是 GCC 16，runner 上的 GCC 版本不同，
          # 新版本可能引入新警告；这里把警告打出来但不阻断，真正闸门是自检本身。
          gcc -std=c99 -Wall -Wextra -O2 \
              -I "$INCLUDE_DIR" -I "$LITE_DIR/include" \
              "$LITE_DIR"/src/*.c \
              "$LITE_DIR"/tests/zb_lite_kernel_selftest.c \
              -o build/lite_selftest

      - name: Run selftest
        run: |
          ./build/lite_selftest
          echo "退出码 0 = 全部断言通过"

      - name: Pedantic syntax check (header hygiene)
        run: |
          mkdir -p build/pedantic
          for f in "$LITE_DIR"/src/*.c; do
            gcc -std=c99 -pedantic -Wall -Wextra -O1 -c \
                -I "$INCLUDE_DIR" -I "$LITE_DIR/include" \
                "$f" -o "build/pedantic/$(basename "$f" .c).o"
          done
          echo "pedantic 语法检查通过"

  # ---------------------------------------------------------------
  # 0b) CMake 构建路径：独立 job，不阻塞产物构建。
  #     本机开发环境没有 cmake，这条路径无法在本地验证，因此交给 CI；
  #     单独成 job 是为了即使它失败，windows-dll / android-so / linux-so
  #     仍能照常产出可安装的插件包。
  # ---------------------------------------------------------------
  cmake-build:
    name: CMake path (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show cmake version
        run: cmake --version

      - name: Configure
        run: |
          cmake -S "$LITE_DIR" -B build/lite-kernel \
                -DCMAKE_BUILD_TYPE=Release \
                -DZB_LITE_BUILD_SELFTEST=ON

      - name: Build
        run: cmake --build build/lite-kernel --parallel

      - name: Run CMake-built selftest
        run: ./build/lite-kernel/zb_lite_kernel_selftest

      - name: Verify shared library exports
        run: |
          SO=build/lite-kernel/libzb_lite_kernel.so
          test -f "$SO" || { echo "::error::CMake 未产出 $SO"; exit 1; }
          COUNT=$(nm -D --defined-only "$SO" | grep -c ' T zb_')
          echo "导出的 zb_* 符号数：$COUNT"
          test "$COUNT" -ge 16 || { echo "::error::导出符号不足 16 个"; exit 1; }

  # ---------------------------------------------------------------
  # 1) Windows：用 MSVC 编译 .dll（windows-latest 自带 VS 构建工具）
  # ---------------------------------------------------------------
  windows-dll:
    name: Windows DLLs
    runs-on: windows-latest
    needs: [selftest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build zb_lite_kernel.dll
        shell: cmd
        run: tool\build_lite_kernel.bat

      - name: Build zb_example_kernel.dll
        shell: cmd
        run: |
          if not exist build\kernel-obj mkdir build\kernel-obj
          cl /nologo /LD /O2 /D_CRT_SECURE_NO_WARNINGS ^
             /I %INCLUDE_DIR% ^
             %EXAMPLE_SRC% ^
             /Fe:%EXAMPLE_DIR%\kernels\windows\zb_example_kernel.dll ^
             /Fo:build\kernel-obj\

      - name: Verify exported symbols
        shell: pwsh
        run: |
          $required = @(
            'zb_abi_version','zb_kernel_create','zb_kernel_destroy',
            'zb_kernel_name','zb_kernel_version',
            'zb_kernel_load_url','zb_kernel_go_back','zb_kernel_go_forward',
            'zb_kernel_reload','zb_kernel_eval_js',
            'zb_kernel_current_url','zb_kernel_title',
            'zb_kernel_attach_surface','zb_kernel_tick',
            'zb_kernel_dispatch_from_host','zb_free_ptr'
          )
          $dlls = @(
            "$env:LITE_PLUGIN/kernels/windows/zb_lite_kernel.dll",
            "$env:EXAMPLE_DIR/kernels/windows/zb_example_kernel.dll"
          )
          foreach ($dll in $dlls) {
            if (-not (Test-Path $dll)) { throw "DLL 未生成: $dll" }
            $text = (& dumpbin /nologo /exports $dll) -join "`n"
            $missing = $required | Where-Object { $text -notmatch [regex]::Escape($_) }
            if ($missing) { throw "$dll 缺少导出符号: $($missing -join ', ')" }
            Get-Item $dll | ForEach-Object { "OK  $($_.Name)  $($_.Length) 字节  16/16 符号" }
          }

      - name: Upload DLLs
        uses: actions/upload-artifact@v4
        with:
          name: kernel-windows-dll
          path: |
            example_plugins/lite_kernel/kernels/windows/zb_lite_kernel.dll
            example_plugins/hello_ffi_kernel/kernels/windows/zb_example_kernel.dll
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 2) Android：用 NDK 交叉编译三个 ABI 的 .so
  # ---------------------------------------------------------------
  android-so:
    name: Android .so (${{ matrix.abi }})
    runs-on: ubuntu-latest
    needs: [selftest]
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triple: aarch64-linux-android
          - abi: armeabi-v7a
            triple: armv7a-linux-androideabi
          - abi: x86_64
            triple: x86_64-linux-android
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest 已预装 Android SDK（ANDROID_SDK_ROOT），直接用它自带的
      # sdkmanager 安装 NDK 即可（android-actions/setup-android 在新版 runner 上会失败）。
      - name: Install NDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          "$SDKMANAGER" --install "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          ls "$SDK/ndk"

      - name: Compile zb_lite_kernel (${{ matrix.abi }})
        run: |
          NDK="$ANDROID_NDK"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.triple }}24-clang"
          OUT="$LITE_PLUGIN/kernels/android/${{ matrix.abi }}"
          mkdir -p "$OUT"
          "$CC" -shared -fPIC -O2 -Wall -Wextra \
                -I "$INCLUDE_DIR" -I "$LITE_DIR/include" \
                "$LITE_DIR"/src/*.c \
                -o "$OUT/libzb_lite_kernel.so"
          file "$OUT/libzb_lite_kernel.so"

      - name: Compile zb_example_kernel (${{ matrix.abi }})
        run: |
          NDK="$ANDROID_NDK"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.triple }}24-clang"
          OUT="$EXAMPLE_DIR/kernels/android/${{ matrix.abi }}"
          mkdir -p "$OUT"
          "$CC" -shared -fPIC -O2 -Wall -Wextra \
                -I "$INCLUDE_DIR" \
                "$EXAMPLE_SRC" \
                -o "$OUT/libzb_example_kernel.so"
          file "$OUT/libzb_example_kernel.so"

      - name: Verify exported symbols
        run: |
          NDK="$ANDROID_NDK"
          NM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          SO="$LITE_PLUGIN/kernels/android/${{ matrix.abi }}/libzb_lite_kernel.so"
          COUNT=$("$NM" -D --defined-only "$SO" | grep -c ' T zb_' || true)
          echo "导出的 zb_* 符号数：$COUNT"
          if [ "$COUNT" -lt 16 ]; then
            echo "::error::导出符号不足 16 个（实际 $COUNT）"
            exit 1
          fi

      - name: Upload shared libraries
        uses: actions/upload-artifact@v4
        with:
          name: kernel-android-so-${{ matrix.abi }}
          path: |
            example_plugins/lite_kernel/kernels/android/${{ matrix.abi }}/libzb_lite_kernel.so
            example_plugins/hello_ffi_kernel/kernels/android/${{ matrix.abi }}/libzb_example_kernel.so
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 3) Linux .so（宿主在 Linux 上也能用插件内核）
  # ---------------------------------------------------------------
  linux-so:
    name: Linux .so
    runs-on: ubuntu-latest
    needs: [selftest]
    steps:
      - uses: actions/checkout@v4

      - name: Compile shared library
        run: |
          OUT="$LITE_PLUGIN/kernels/linux/x86_64"
          mkdir -p "$OUT"
          gcc -shared -fPIC -O2 -Wall -Wextra \
              -I "$INCLUDE_DIR" -I "$LITE_DIR/include" \
              "$LITE_DIR"/src/*.c \
              -o "$OUT/libzb_lite_kernel.so"
          file "$OUT/libzb_lite_kernel.so"

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-linux-so
          path: example_plugins/lite_kernel/kernels/linux/x86_64/libzb_lite_kernel.so
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 4) 汇总：把各平台产物放回 manifest 声明的路径，再打包成插件 zip / .zbk
  # ---------------------------------------------------------------
  package:
    name: Package plugin zips
    runs-on: ubuntu-latest
    needs: [windows-dll, android-so, linux-so]
    steps:
      - uses: actions/checkout@v4

      - name: Download all kernel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Assemble plugin directories
        run: |
          mkdir -p "$LITE_PLUGIN/kernels/windows" "$LITE_PLUGIN/kernels/android" "$LITE_PLUGIN/kernels/linux/x86_64"
          cp dist/kernel-windows-dll/zb_lite_kernel.dll "$LITE_PLUGIN/kernels/windows/"
          cp dist/kernel-linux-so/libzb_lite_kernel.so "$LITE_PLUGIN/kernels/linux/x86_64/"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "$LITE_PLUGIN/kernels/android/$abi"
            cp "dist/kernel-android-so-$abi/libzb_lite_kernel.so" "$LITE_PLUGIN/kernels/android/$abi/"
          done

          mkdir -p "$EXAMPLE_DIR/kernels/windows" "$EXAMPLE_DIR/kernels/android"
          cp dist/kernel-windows-dll/zb_example_kernel.dll "$EXAMPLE_DIR/kernels/windows/"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "$EXAMPLE_DIR/kernels/android/$abi"
            cp "dist/kernel-android-so-$abi/libzb_example_kernel.so" "$EXAMPLE_DIR/kernels/android/$abi/"
          done

          find "$LITE_PLUGIN/kernels" "$EXAMPLE_DIR/kernels" -type f | sort

      - name: Validate manifest paths
        run: |
          python3 - <<'PY'
          import json, os, sys

          def check(root):
              m = json.load(open(os.path.join(root, "manifest.json"), encoding="utf-8"))
              libs = m["kernel"]["libraries"]
              wanted = []
              if isinstance(libs.get("windows"), str):
                  wanted.append(libs["windows"])
              if isinstance(libs.get("linux"), str):
                  wanted.append(libs["linux"])
              android = libs.get("android")
              if isinstance(android, dict):
                  wanted.extend(android.values())
              missing = [p for p in wanted if not os.path.isfile(os.path.join(root, p))]
              if missing:
                  raise SystemExit(f"{root}: manifest 声明的文件缺失: {missing}")
              print(f"{root}: manifest 校验通过（{len(wanted)} 个库文件）")

          check("example_plugins/lite_kernel")
          check("example_plugins/hello_ffi_kernel")
          PY

      - name: Pack plugin zips
        run: |
          python3 tool/pack_plugin.py "$LITE_PLUGIN" lite_kernel.zip
          python3 tool/pack_plugin.py "$EXAMPLE_DIR" hello_ffi_kernel.zip

      - name: Pack standalone kernel package (.zbk)
        run: |
          if [ -f build_kernel_pkg/zb_lite_kernel/kernel.json ]; then
            mkdir -p build_kernel_pkg/zb_lite_kernel/bin/windows
            cp dist/kernel-windows-dll/zb_lite_kernel.dll build_kernel_pkg/zb_lite_kernel/bin/windows/
            python3 tool/pack_kernel.py build_kernel_pkg/zb_lite_kernel zb_lite_kernel.zbk
          else
            echo "未找到 build_kernel_pkg/zb_lite_kernel，跳过"
          fi

      - name: Upload plugin packages
        uses: actions/upload-artifact@v4
        with:
          name: kernel-plugin-packages
          path: |
            lite_kernel.zip
            hello_ffi_kernel.zip
            *.zbk
          if-no-files-found: warn
