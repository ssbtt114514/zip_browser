name: build-kernel

# 内核构建：产出三种风味里 Gecko 版所需的内核包（.zbk），按平台/架构拆分：
#   - Android：arm64-v8a / armeabi-v7a / x86 / x86_64（NDK 交叉编译）
#   - Linux：x64（ubuntu-latest）/ arm64（ubuntu-24.04-arm 原生编译）
#   - Windows：x64 / arm64（MSVC 交叉编译）
#
# 说明：应用工作流（build-android-apk / build-linux / build-windows）在构建
# Gecko 风味时会自行编译内核并随包内置；本工作流用于独立验证内核可编译、
# 可打包，并保留手动下载内核包的能力。
#
# 触发说明：push 下 tags 与 paths 是「与」关系，因此显式声明 branches，
# 让 main 推送与 tag 都能命中。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'native_kernels/**'
      - 'native_plugins/zb_native_surface/include/**'
      - 'build_kernel_pkg/zb_gecko_kernel/**'
      - 'tool/build_engine_kernels.py'
      - 'tool/pack_kernel.py'
      - '.github/workflows/build-kernel.yml'
  pull_request:
    paths:
      - 'native_kernels/**'
      - 'native_plugins/zb_native_surface/include/**'
      - 'build_kernel_pkg/zb_gecko_kernel/**'
      - 'tool/build_engine_kernels.py'
      - 'tool/pack_kernel.py'
      - '.github/workflows/build-kernel.yml'

env:
  INCLUDE_DIR: native_plugins/zb_native_surface/include
  LITE_DIR: native_kernels/zb_lite_kernel
  PKG: build_kernel_pkg/zb_gecko_kernel

jobs:
  # ---------------------------------------------------------------
  # 0) 端到端自检：gcc 编译内核 + 自检程序，证明内核能解析、排版、渲染
  # ---------------------------------------------------------------
  selftest:
    name: Self-test (linux/gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile kernel + selftest
        run: |
          mkdir -p build
          gcc -std=c99 -Wall -Wextra -O2 \
              -I "$INCLUDE_DIR" -I "$LITE_DIR/include" \
              "$LITE_DIR"/src/*.c \
              "$LITE_DIR"/tests/zb_lite_kernel_selftest.c \
              -o build/lite_selftest

      - name: Run selftest
        run: ./build/lite_selftest

  # ---------------------------------------------------------------
  # 1) Android：NDK 交叉编译四个 ABI
  # ---------------------------------------------------------------
  android:
    name: Android zbk (4 ABI)
    runs-on: ubuntu-latest
    needs: [selftest]
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          "$SDKMANAGER" --install "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build four ABIs
        run: python3 tool/build_engine_kernels.py --platform android

      - name: Pack .zbk
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 tool/pack_kernel.py "$PKG" dist/zip-browser-kernel-gecko-android.zbk --platforms android
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('dist/zip-browser-kernel-gecko-android.zbk') as z:
              names = z.namelist()
              for abi in ('arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'):
                  assert any(f'/android/{abi}/' in n for n in names), f'缺少 {abi}'
              print('ABI 齐全：', len(names), '个条目')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: zbk-gecko-android
          path: dist/*.zbk
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 2) Linux：原生架构编译
  # ---------------------------------------------------------------
  linux:
    name: Linux zbk (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [selftest]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build kernel
        run: python3 tool/build_engine_kernels.py --platform linux

      - name: Pack .zbk
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 tool/pack_kernel.py "$PKG" dist/zip-browser-kernel-gecko-linux-${{ matrix.arch }}.zbk --platforms linux
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('dist/zip-browser-kernel-gecko-linux-${{ matrix.arch }}.zbk') as z:
              names = z.namelist()
              assert any(n.startswith('bin/linux/') for n in names), '缺少 linux 内核库'
              print('条目数：', len(names))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: zbk-gecko-linux-${{ matrix.arch }}
          path: dist/*.zbk
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 3) Windows：MSVC 交叉编译 x64 / arm64
  # ---------------------------------------------------------------
  windows:
    name: Windows zbk (${{ matrix.arch }})
    runs-on: windows-latest
    needs: [selftest]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
          - arch: arm64
            cmake_arch: ARM64
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Build kernel DLL
        shell: pwsh
        run: |
          cmake -S "$env:LITE_DIR" -B build/kernel -A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake 配置失败：$LASTEXITCODE" }
          cmake --build build/kernel --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "内核编译失败：$LASTEXITCODE" }

          $dll = Get-ChildItem -Recurse -Path build/kernel -Filter 'zb_lite_kernel.dll' |
                 Select-Object -First 1
          if (-not $dll) { throw '未找到 zb_lite_kernel.dll' }

          $required = @(
            'zb_abi_version','zb_kernel_create','zb_kernel_destroy',
            'zb_kernel_name','zb_kernel_version',
            'zb_kernel_load_url','zb_kernel_go_back','zb_kernel_go_forward',
            'zb_kernel_reload','zb_kernel_eval_js',
            'zb_kernel_current_url','zb_kernel_title',
            'zb_kernel_attach_surface','zb_kernel_tick',
            'zb_kernel_dispatch_from_host','zb_free_ptr'
          )
          $text = (& dumpbin /nologo /exports $dll.FullName) -join "`n"
          $missing = $required | Where-Object { $text -notmatch [regex]::Escape($_) }
          if ($missing) { throw "缺少导出符号：$($missing -join ', ')" }

          New-Item -ItemType Directory -Force -Path "$env:PKG/bin/windows" | Out-Null
          Copy-Item $dll.FullName "$env:PKG/bin/windows/zb_gecko_kernel.dll" -Force

      - name: Pack .zbk
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          python tool/pack_kernel.py "$env:PKG" "dist/zip-browser-kernel-gecko-windows-${{ matrix.arch }}.zbk" --platforms windows
          if ($LASTEXITCODE -ne 0) { throw "打包失败：$LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: zbk-gecko-windows-${{ matrix.arch }}
          path: dist/*.zbk
          if-no-files-found: error
